name = "LeanSage"
version = "0.2.0"
defaultTargets = ["LeanSage"]
testDriver = "sage_tests"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "LeanSage"

[[lean_exe]]
name = "leansage"
root = "Main"

[[lean_exe]]
name = "sage_tests"
root = "TestDriver"
